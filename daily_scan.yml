name: Daily Minervini Scan

on:
  schedule:
    # 美东时间周一至周五 17:30 (盘后30分钟)
    # UTC时间 21:30 / 22:30 (冬令时/夏令时)
    # 这里用 21:30 UTC,冬令时对应EST 16:30,夏令时对应EDT 17:30
    # 为了稳妥,跑两次:21:30 和 22:30,确保至少一次在盘后
    - cron: '30 21 * * 1-5'
    - cron: '30 22 * * 1-5'
  # 支持手动触发
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Minervini scan
        run: python scanner.py
      
      - name: Generate full HTML report
        run: python generate_report.py
      
      - name: Send email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: python send_email.py
        
      - name: Publish latest.json for trading-brain
        run: cp reports/latest.json docs/latest.json

      - name: Commit latest.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/latest.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update latest.json"
          git push
          
      - name: Commit updated reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/ docs/
          git diff --staged --quiet || git commit -m "Daily scan: $(date +'%Y-%m-%d')"
          git push
        continue-on-error: true
